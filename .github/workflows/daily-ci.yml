name: daily-ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install "ruff==0.15.16" "black<26" pytest
          pip install -e .
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Tests
        run: pytest -q

  sdk-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Committed bundle matches source
        working-directory: .
        run: |
          git add -N agentmesh/static/app
          if ! git diff --exit-code --stat -- agentmesh/static/app; then
            echo "agentmesh/static/app is stale: run 'npm run build' in dashboard/ and commit it."
            exit 1
          fi
